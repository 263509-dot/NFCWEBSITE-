<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오늘의 게임 뽑기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0F0C1B;
    --panel:#19152B;
    --panel2:#231D3C;
    --border:rgba(255,255,255,0.08);
    --text:#F4F1FF;
    --muted:#9C93BE;
    --pink:#FF4D8D;
    --mint:#35E7B7;
    --amber:#FFB238;
    --stage-a:#7C6CF6;
    --stage-b:#241D3F;
    --stage-accent:#8B7CFF;
    --radius-lg:28px;
    --radius-md:18px;
    --radius-sm:10px;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100%;
    background:
      radial-gradient(1100px 700px at 15% -10%, rgba(139,124,255,0.25), transparent 60%),
      radial-gradient(900px 600px at 110% 10%, rgba(255,77,141,0.16), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:'Sora', sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    transition:background 0.6s ease;
  }
  body.stage-mode{
    background:
      radial-gradient(1200px 800px at 20% -10%, color-mix(in srgb, var(--stage-a) 35%, transparent), transparent 60%),
      radial-gradient(1000px 700px at 100% 100%, color-mix(in srgb, var(--stage-b) 55%, transparent), transparent 60%),
      var(--bg);
  }
  h1,h2,h3,.display{
    font-family:'Fredoka', sans-serif;
    letter-spacing:0.2px;
    margin:0;
  }
  .wrap{
    max-width:760px;
    margin:0 auto;
    padding:28px 20px 64px;
  }
  header.top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:34px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    font-family:'Fredoka';
    font-weight:600;
    font-size:19px;
  }
  .brand-dot{
    width:12px;height:12px;border-radius:50%;
    background:linear-gradient(135deg,var(--pink),var(--amber));
    box-shadow:0 0 14px rgba(255,77,141,0.7);
  }
  .streak-badge{
    font-size:13px;
    color:var(--muted);
    background:var(--panel);
    border:1px solid var(--border);
    padding:7px 13px;
    border-radius:999px;
  }
  .streak-badge b{color:var(--amber);font-weight:600;}

  /* ---------- HERO ---------- */
  section#hero{
    text-align:center;
    padding:26px 0 10px;
  }
  .eyebrow-free{
    color:var(--muted);
    font-size:15px;
    margin-bottom:10px;
  }
  .hero-title{
    font-size:clamp(30px,7vw,44px);
    line-height:1.18;
    font-weight:700;
  }
  .hero-title span{
    background:linear-gradient(120deg,var(--pink),var(--amber) 60%, var(--mint));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .hero-sub{
    color:var(--muted);
    font-size:16px;
    max-width:420px;
    margin:14px auto 40px;
    line-height:1.6;
  }

  .capsule-zone{
    position:relative;
    width:220px;height:220px;
    margin:0 auto 38px;
    display:flex;align-items:center;justify-content:center;
  }
  .capsule-glow{
    position:absolute;inset:0;
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,77,141,0.35), transparent 70%);
    filter:blur(6px);
    animation:pulse 2.6s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{transform:scale(0.94);opacity:0.7;}
    50%{transform:scale(1.05);opacity:1;}
  }
  .capsule{
    position:relative;
    width:150px;height:150px;
    border-radius:50%;
    background:
      linear-gradient(180deg, rgba(255,255,255,0.9) 0 49%, var(--pink) 49% 100%);
    box-shadow:
      0 18px 40px rgba(0,0,0,0.45),
      inset 0 -6px 14px rgba(0,0,0,0.15),
      inset 0 6px 10px rgba(255,255,255,0.5);
    transition:transform 0.15s ease;
  }
  .capsule::after{
    content:'';
    position:absolute;
    left:50%;top:50%;
    width:34px;height:34px;
    border-radius:50%;
    background:var(--panel);
    border:5px solid #fff;
    transform:translate(-50%,-50%);
    box-shadow:0 2px 6px rgba(0,0,0,0.3);
  }
  .capsule.shaking{ animation: shake 0.5s ease-in-out; }
  @keyframes shake{
    0%,100%{transform:rotate(0deg) translateX(0);}
    20%{transform:rotate(-8deg) translateX(-4px);}
    40%{transform:rotate(7deg) translateX(4px);}
    60%{transform:rotate(-6deg) translateX(-3px);}
    80%{transform:rotate(5deg) translateX(2px);}
  }
  .capsule.popped{ animation: pop-away 0.45s ease-in forwards; }
  @keyframes pop-away{
    to{ transform:scale(0.2); opacity:0; }
  }

  .btn{
    font-family:'Fredoka';
    font-weight:600;
    font-size:17px;
    border:none;
    cursor:pointer;
    border-radius:999px;
    padding:16px 34px;
    color:#160E26;
    background:linear-gradient(120deg,var(--mint),#9BFFE0);
    box-shadow:0 10px 24px rgba(53,231,183,0.35);
    transition:transform 0.15s ease, box-shadow 0.15s ease, opacity 0.2s ease;
  }
  .btn:hover{transform:translateY(-2px);}
  .btn:active{transform:translateY(0px) scale(0.98);}
  .btn:disabled{opacity:0.55;cursor:not-allowed;transform:none;}
  .btn.secondary{
    background:var(--panel2);
    color:var(--text);
    box-shadow:none;
    border:1px solid var(--border);
  }
  .btn.small{padding:10px 20px;font-size:14px;}

  .pool-hint{
    margin-top:22px;
    font-size:13px;
    color:var(--muted);
  }

  /* ---------- RESULT CARD ---------- */
  section#result{ display:none; }
  .reveal-card{
    background:linear-gradient(160deg, var(--panel), var(--panel2));
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:34px 26px;
    text-align:center;
    position:relative;
    overflow:hidden;
    animation:card-in 0.5s cubic-bezier(.2,.9,.3,1.3);
  }
  @keyframes card-in{
    from{opacity:0; transform:translateY(18px) scale(0.97);}
    to{opacity:1; transform:translateY(0) scale(1);}
  }
  .reveal-card::before{
    content:'';
    position:absolute; inset:-40% -10% auto -10%;
    height:220px;
    background:radial-gradient(circle, var(--stage-accent), transparent 65%);
    opacity:0.35;
    pointer-events:none;
  }
  .reveal-label{
    font-size:13px;
    color:var(--muted);
    margin-bottom:18px;
    position:relative;
  }
  .game-icon{
    width:104px;height:104px;
    margin:0 auto 18px;
    border-radius:28px;
    display:flex;align-items:center;justify-content:center;
    font-size:52px;
    background:linear-gradient(145deg, color-mix(in srgb, var(--stage-accent) 55%, var(--panel)), var(--panel2));
    box-shadow:0 12px 26px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.08);
    position:relative;
  }
  .game-icon.orb{
    background:radial-gradient(circle at 35% 30%, #fff, var(--stage-accent) 60%, #1a1430 100%);
    border:4px solid rgba(255,255,255,0.25);
  }
  .game-name{
    font-size:26px;
    font-weight:700;
    margin-bottom:6px;
    position:relative;
  }
  .game-tag{
    font-size:14px;
    color:var(--stage-accent);
    font-weight:600;
    margin-bottom:16px;
  }
  .game-desc{
    font-size:15px;
    line-height:1.65;
    color:var(--muted);
    max-width:420px;
    margin:0 auto 26px;
    position:relative;
  }
  .result-actions{
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
    position:relative;
  }

  /* ---------- ARENA ---------- */
  section#arena{ display:none; }
  .arena-card{
    background:linear-gradient(160deg, var(--panel), var(--panel2));
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:22px;
  }
  .arena-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
    gap:10px;
    flex-wrap:wrap;
  }
  .arena-title{
    display:flex;align-items:center;gap:10px;
    font-family:'Fredoka';font-weight:600;font-size:17px;
  }
  .arena-title .dot-icon{
    width:34px;height:34px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    font-size:19px;
    background:color-mix(in srgb, var(--stage-accent) 35%, var(--panel2));
  }
  .hud{
    display:flex; gap:14px; font-size:13px; color:var(--muted);
  }
  .hud b{ color:var(--text); font-family:'Fredoka'; font-size:15px; }
  .canvas-wrap{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    border-radius:var(--radius-md);
    overflow:hidden;
    background:#0B0916;
    border:1px solid var(--border);
    touch-action:none;
  }
  canvas{
    width:100%; height:100%; display:block;
  }
  .overlay-msg{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px;
    background:rgba(10,8,20,0.72);
    text-align:center;
    padding:20px;
  }
  .overlay-msg h3{ font-size:22px; }
  .overlay-msg p{ color:var(--muted); font-size:14px; margin:0; max-width:280px; line-height:1.6;}
  .controls-hint{
    margin-top:12px;
    font-size:12.5px;
    color:var(--muted);
    text-align:center;
  }
  .arena-actions{
    display:flex; gap:10px; justify-content:center; margin-top:16px; flex-wrap:wrap;
  }
  .best-line{ font-size:12px; color:var(--muted); margin-top:4px;}
  .best-line b{color:var(--amber);}

  footer{
    text-align:center;
    color:var(--muted);
    font-size:12px;
    margin-top:40px;
  }

  .rarity-badge{
    display:inline-block; font-size:12px; font-weight:700;
    padding:4px 13px; border-radius:999px; margin-bottom:12px; letter-spacing:0.02em;
  }
  .rarity-common{ background:rgba(255,255,255,0.12); color:#cfcbe6; }
  .rarity-rare{ background:rgba(76,217,255,0.18); color:#7fd4ff; }
  .rarity-epic{ background:rgba(186,109,255,0.22); color:#d4a6ff; }
  .rarity-legendary{ background:linear-gradient(90deg,#ffd66b,#ff9a4c); color:#3a1c00; }

  .confetti-bit{
    position:fixed; width:7px; height:7px; border-radius:2px;
    z-index:80; pointer-events:none; left:0; top:0;
    animation:confettiFly 0.9s ease-out forwards;
  }
  @keyframes confettiFly{ to{ transform:translate(var(--dx),var(--dy)) rotate(var(--rot)); opacity:0; } }

  .screen-flash{
    position:fixed; inset:0; z-index:75; pointer-events:none; opacity:0;
    animation:flashPulse 0.4s ease-out forwards;
  }
  @keyframes flashPulse{ 0%{opacity:0;} 18%{opacity:1;} 100%{opacity:0;} }

  .impact-banner{
    position:fixed; left:50%; top:22%; z-index:81;
    font-family:'Fredoka'; font-size:34px; color:#fff;
    text-shadow:0 8px 24px rgba(0,0,0,0.5); pointer-events:none;
    opacity:0; transform:translate(-50%,-50%) scale(0.3) rotate(-8deg);
    animation:bannerPop 1.1s cubic-bezier(.2,1.4,.4,1) forwards;
  }
  @keyframes bannerPop{
    0%{ opacity:0; transform:translate(-50%,-50%) scale(0.3) rotate(-10deg); }
    28%{ opacity:1; transform:translate(-50%,-50%) scale(1.18) rotate(3deg); }
    50%{ transform:translate(-50%,-50%) scale(0.95) rotate(-2deg); }
    75%{ opacity:1; transform:translate(-50%,-50%) scale(1) rotate(0deg); }
    100%{ opacity:0; transform:translate(-50%,-50%) scale(1.05) rotate(0deg); }
  }
  body.shake-fx{ animation:bodyShake 0.4s ease; }
  @keyframes bodyShake{
    0%,100%{ transform:translate(0,0); }
    20%{ transform:translate(-6px,3px); } 40%{ transform:translate(6px,-3px); }
    60%{ transform:translate(-4px,3px); } 80%{ transform:translate(4px,-2px); }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; }
  }

  @media (max-width:480px){
    .reveal-card{padding:26px 18px;}
    .capsule-zone{width:180px;height:180px;}
    .capsule{width:120px;height:120px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="brand"><span class="brand-dot"></span>오늘의 게임 뽑기</div>
    <div class="streak-badge">오늘 뽑은 게임 <b id="pickCount">0</b>개</div>
  </header>

  <section id="hero">
    <div class="eyebrow-free">12가지 인기 모바일 게임이 기다리는 중</div>
    <h1 class="hero-title">오늘은 어떤 게임을<br><span>플레이</span>해볼까?</h1>
    <p class="hero-sub">캡슐을 뽑으면 오늘의 게임이 무작위로 정해지고, 그 자리에서 바로 미니 버전으로 즐길 수 있어요.</p>

    <div class="capsule-zone">
      <div class="capsule-glow"></div>
      <div class="capsule" id="capsule"></div>
    </div>

    <button class="btn" id="drawBtn">오늘의 게임 뽑기</button>
    <div class="pool-hint">로블록스 · 블록 블라스트 · 브롤스타즈 · 포켓몬고 · 마인크래프트<br>좀비고 · 쿠키런 킹덤 · 배그 · 클래시로얄 · FC 모바일 · 프리 파이어 · 모두의마블</div>
  </section>

  <section id="result">
    <div class="reveal-card">
      <div class="reveal-label">오늘의 게임으로 선정됐어요</div>
      <div class="rarity-badge" id="resultRarity"></div>
      <div class="game-icon" id="resultIcon"></div>
      <div class="game-name" id="resultName"></div>
      <div class="game-tag" id="resultTag"></div>
      <p class="game-desc" id="resultDesc"></p>
      <div class="result-actions">
        <button class="btn" id="playBtn">지금 체험하기</button>
        <button class="btn secondary" id="reDrawBtn">다시 뽑기</button>
      </div>
    </div>
  </section>

  <section id="arena">
    <div class="arena-card">
      <div class="arena-head">
        <div class="arena-title"><span class="dot-icon" id="arenaIcon"></span><span id="arenaName"></span></div>
        <div class="hud" id="arenaHud"></div>
      </div>
      <div class="canvas-wrap" id="canvasWrap">
        <canvas id="gameCanvas" width="640" height="360"></canvas>
        <div class="overlay-msg" id="overlay">
          <h3 id="overlayTitle">준비됐나요?</h3>
          <p id="overlayText"></p>
          <button class="btn" id="startGameBtn">시작하기</button>
        </div>
      </div>
      <div class="controls-hint" id="controlsHint"></div>
      <div class="arena-actions">
        <button class="btn secondary small" id="backBtn">다른 게임 뽑기</button>
        <button class="btn small" id="retryBtn" style="display:none;">한 번 더 플레이</button>
      </div>
      <div class="best-line" id="bestLine" style="text-align:center;"></div>
    </div>
  </section>

  <footer>버튼을 눌러 오늘의 게임을 뽑고, 미니 버전으로 감을 잡아보세요.</footer>
</div>

<script>

  /* ================= 게임 데이터 ================= */

    { id:'clash', name:'클래시로얄', emoji:'🏰', tag:'실시간 전략', rarity:'epic',

    { id:'fcmobile', name:'FC 모바일', emoji:'⚽', tag:'축구 시뮬레이션', rarity:'epic',

  function getPointerPos(evt){
    var rect = canvas.getBoundingClientRect();
    var cx = (evt.touches ? evt.touches[0].clientX : evt.clientX);
    var cy = (evt.touches ? evt.touches[0].clientY : evt.clientY);
    return { x:(cx-rect.left)/rect.width*W, y:(cy-rect.top)/rect.height*H };
  }

  canvas.addEventListener('pointerdown', function(e){
    var p = getPointerPos(e);
    input.pointerDown = true; input.px = p.x; input.py = p.y;
    input.justClick = true; input.clickX = p.x; input.clickY = p.y;
    input.jump = true;
  });
  window.addEventListener('pointerup', function(){ input.pointerDown = false; });
  canvas.addEventListener('pointermove', function(e){
    if(input.pointerDown){ var p = getPointerPos(e); input.px = p.x; input.py = p.y; }
  });

  window.addEventListener('keydown', function(e){
    if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].indexOf(e.key)!==-1 && running) e.preventDefault();
    if(e.key==='ArrowLeft'||e.key==='a') input.left = true;
    if(e.key==='ArrowRight'||e.key==='d') input.right = true;
    if(e.key==='ArrowUp'||e.key==='w') input.up = true;
    if(e.key==='ArrowDown'||e.key==='s') input.down = true;
    if(e.key===' '){ input.jump = true; }
  });
  window.addEventListener('keyup', function(e){
    if(e.key==='ArrowLeft'||e.key==='a') input.left = false;
    if(e.key==='ArrowRight'||e.key==='d') input.right = false;
    if(e.key==='ArrowUp'||e.key==='w') input.up = false;
    if(e.key==='ArrowDown'||e.key==='s') input.down = false;
    if(e.key===' '){ input.jump = false; }
  });

  function resetInputEdges(){ input.justClick = false; input.jump = false; }

  function stopLoop(){
    running = false;
    if(rafId) cancelAnimationFrame(rafId);
  }

  function loop(ts){
    if(!running) return;
    var dt = Math.min(0.035, (ts-lastTs)/1000 || 0.016);
    lastTs = ts;
    var mod = MiniGames[currentGame.mini];
    mod.update(dt);
    ctx.clearRect(0,0,W,H);
    mod.draw(ctx);
    resetInputEdges();
    if(GS.over){
      endGame();
      return;
    }
    rafId = requestAnimationFrame(loop);
  }

  function openArena(g){
    var mod = MiniGames[g.mini];
    overlay.style.display = 'flex';

    controlsHint.textContent = mod.controlsText;

    arenaHud.innerHTML = mod.hudTemplate();
    var best = safeGet('gp_best_' + g.id);
    bestLine.innerHTML = best ? '이전 최고 기록: <b>' + best + '</b>' : '';
    GS = {};
    mod.init();
    drawIdle(mod);
  }

  function drawIdle(mod){

  var MiniGames = {};

  function makeRunner(opts){
    // opts: groundY, gravity, jumpV, obstacleColor, allowDuck
    return {
      introText: opts.introText,
      controlsText: opts.controlsText,
      hudTemplate: function(){ return '<span>거리 <b id="hudScore">0</b>m</span><span>속도 <b id="hudSpeed">1.0</b>x</span>'; },
      init: function(){
        GS.player = { x:90, y:opts.groundY, vy:0, w:34, h:34, onGround:true, ducking:false };
        GS.obstacles = [];
        GS.timer = 0;
        GS.speed = 240;
        GS.spawnTimer = 0;
        GS.dist = 0;
        GS.over = false;
      },
      start: function(){},
      update: function(dt){
        var p = GS.player;
        GS.timer += dt;
        GS.speed = 240 + Math.min(220, GS.timer*10);
        GS.dist += GS.speed*dt/60;

        if((input.jump || input.up) && p.onGround && !p.ducking){
          p.vy = opts.jumpV; p.onGround = false;
        }
        p.ducking = !!(opts.allowDuck && input.down && p.onGround);

        p.vy += opts.gravity*dt;
        p.y += p.vy*dt;
        if(p.y > opts.groundY){ p.y = opts.groundY; p.vy = 0; p.onGround = true; }

        GS.spawnTimer -= dt;
        if(GS.spawnTimer <= 0){
          GS.spawnTimer = Math.max(0.7, 1.5 - GS.timer*0.02) + Math.random()*0.5;
          var low = opts.allowDuck && Math.random() < 0.35;
          GS.obstacles.push({ x:W+20, w: low?46:26, h: low?22:(30+Math.random()*22), low:low });
        }
        for(var i=GS.obstacles.length-1;i>=0;i--){
          var o = GS.obstacles[i];
          o.x -= GS.speed*dt;
          if(o.x < -60) GS.obstacles.splice(i,1);
        }

        var ph = p.ducking ? 18 : p.h;
        var py2 = p.ducking ? opts.groundY + (34-18) : p.y;
        for(var j=0;j<GS.obstacles.length;j++){
          var ob = GS.obstacles[j];
          var obY = ob.low ? (opts.groundY+34-ob.h-6) : (opts.groundY+34-ob.h);
          if(p.x < ob.x+ob.w && p.x+p.w > ob.x && py2 < obY+ob.h && py2+ph > obY){
            GS.over = true;
          }
        }
        el('hudScore') && (el('hudScore').textContent = Math.floor(GS.dist));
        el('hudSpeed') && (el('hudSpeed').textContent = (GS.speed/240).toFixed(1));
      },
      draw: function(ctx){
        ctx.save();
        var grd = ctx.createLinearGradient(0,0,0,H);
        grd.addColorStop(0, 'rgba(255,255,255,0.03)');
        grd.addColorStop(1, 'rgba(0,0,0,0.15)');
        ctx.fillStyle = grd; ctx.fillRect(0,0,W,H);

        ctx.strokeStyle = 'rgba(255,255,255,0.12)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(0, opts.groundY+34);
        ctx.lineTo(W, opts.groundY+34);
        ctx.stroke();

        var p = GS.player;
        var ph = p.ducking ? 18 : p.h;
        var py2 = p.ducking ? opts.groundY + (34-18) : p.y;
        ctx.fillStyle = opts.playerColor;
        ctx.beginPath();
        if(opts.playerShape==='circle'){
          ctx.arc(p.x+p.w/2, py2+ph/2, ph/2, 0, Math.PI*2);
          ctx.fill();
        } else {
          roundRect(ctx, p.x, py2, p.w, ph, 8); ctx.fill();
        }

        ctx.fillStyle = opts.obstacleColor;
        for(var i=0;i<GS.obstacles.length;i++){
          var ob = GS.obstacles[i];
          var obY = ob.low ? (opts.groundY+34-ob.h-6) : (opts.groundY+34-ob.h);
          roundRect(ctx, ob.x, obY, ob.w, ob.h, 6); ctx.fill();
        }
        ctx.restore();
      },
      drawIdle: function(ctx){
        ctx.fillStyle = 'rgba(255,255,255,0.04)'; ctx.fillRect(0,0,W,H);
        ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.lineWidth=3;
        ctx.beginPath(); ctx.moveTo(0,opts.groundY+34); ctx.lineTo(W,opts.groundY+34); ctx.stroke();
      },
      result: function(){
        var d = Math.floor(GS.dist);
        return {
          title: '결과: ' + d + 'm 달렸어요',
          text: d > 260 ? '엄청난 반사신경이네요! 다시 도전해서 기록을 더 늘려보세요.' : '조금만 더 빠르게 반응하면 훨씬 멀리 갈 수 있어요.',
          scoreForCompare: d, bestDisplay: d+'m'
        };
      }
    };
  }
  function roundRect(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  /* ---- 블록 블라스트 ---- */
  MiniGames.blockblast = (function(){
    var COLS=6, ROWS=6, CELL=0, OX=0, OY=0;
    var COLORS = ['#FF7FB4','#FFD066','#4CFFCB','#9C8CFF'];
    function randColor(){ return Math.floor(Math.random()*COLORS.length); }
    function neighbors(x,y){
      return [[x+1,y],[x-1,y],[x,y+1],[x,y-1]];
    }
    function findGroup(grid,x,y){
      var color = grid[y][x];
      if(color===null) return [];
      var seen = {}; var stack=[[x,y]]; var group=[];
      while(stack.length){
        var c = stack.pop();
        var key = c[0]+','+c[1];
        if(seen[key]) continue;
        seen[key]=true;
        if(c[0]<0||c[0]>=COLS||c[1]<0||c[1]>=ROWS) continue;
        if(grid[c[1]][c[0]] !== color) continue;
        group.push(c);
        neighbors(c[0],c[1]).forEach(function(n){ stack.push(n); });
      }
      return group;
    }
    function applyGravity(grid){
      for(var x=0;x<COLS;x++){
        var col=[];
        for(var y=0;y<ROWS;y++){ if(grid[y][x]!==null) col.push(grid[y][x]); }
        while(col.length<ROWS) col.unshift(randColor());
        for(var y2=0;y2<ROWS;y2++){ grid[y2][x]=col[y2]; }
      }
    }
    return {
      introText:'같은 색 블록이 2개 이상 붙어 있으면 클릭해서 터뜨려요. 40초 안에 최대한 많이 터뜨려보세요.',
      controlsText:'조작법 · 블록을 탭/클릭해서 터뜨리기',
      hudTemplate: function(){ return '<span>점수 <b id="hudScore">0</b></span><span>남은 시간 <b id="hudTime">40</b>s</span>'; },
      init: function(){
        CELL = Math.floor(Math.min(W,H*1.6)/COLS) - 6;
        OX = (W - CELL*COLS)/2; OY = 20;
        GS.grid = [];
        for(var y=0;y<ROWS;y++){ var row=[]; for(var x=0;x<COLS;x++){ row.push(randColor()); } GS.grid.push(row); }
        GS.score = 0; GS.time = 40; GS.over = false; GS.flash=[];
      },
      start: function(){},
      update: function(dt){
        GS.time -= dt;
        if(GS.time <= 0){ GS.time = 0; GS.over = true; }
        if(input.justClick){
          var gx = Math.floor((input.clickX-OX)/CELL);
          var gy = Math.floor((input.clickY-OY)/CELL);
          if(gx>=0&&gx<COLS&&gy>=0&&gy<ROWS){
            var group = findGroup(GS.grid,gx,gy);
            if(group.length>=2){
              group.forEach(function(c){ GS.grid[c[1]][c[0]] = null; });
              GS.score += group.length*10;
              applyGravity(GS.grid);
            }
          }
        }
        el('hudScore') && (el('hudScore').textContent = GS.score);
        el('hudTime') && (el('hudTime').textContent = Math.ceil(GS.time));
      },
      draw: function(ctx){
        ctx.fillStyle = 'rgba(255,255,255,0.03)'; ctx.fillRect(0,0,W,H);
        for(var y=0;y<ROWS;y++){
          for(var x=0;x<COLS;x++){
            var c = GS.grid[y][x];
            if(c===null) continue;
            ctx.fillStyle = COLORS[c];
            roundRect(ctx, OX+x*CELL+3, OY+y*CELL+3, CELL-6, CELL-6, 8);
            ctx.fill();
          }
        }
      },
      drawIdle: function(ctx){
        ctx.fillStyle = 'rgba(255,255,255,0.04)'; ctx.fillRect(0,0,W,H);
      },
      result: function(){
        return {
          title: '결과: ' + GS.score + '점',
          text: GS.score > 400 ? '블록 블라스트 고수시네요! 색 배치를 미리 읽는 게 핵심이에요.' : '큰 덩어리를 먼저 노리면 점수가 훨씬 잘 올라가요.',
          scoreForCompare: GS.score, bestDisplay: GS.score+'점'
        };
      }
    };
  })();

      }
      el('hudHp') && (el('hudHp').textContent = Math.ceil(GS.hp));
      el('hudScore') && (el('hudScore').textContent = fmt1(GS.time));
    },
    draw: function(ctx){
      ctx.fillStyle='rgba(255,255,255,0.03)'; ctx.fillRect(0,0,W,H);
      ctx.strokeStyle='#5CE98C'; ctx.lineWidth=3;
      ctx.beginPath(); ctx.arc(GS.cx,GS.cy,GS.radius,0,Math.PI*2); ctx.stroke();
      ctx.fillStyle='rgba(92,233,140,0.06)';
      ctx.beginPath(); ctx.arc(GS.cx,GS.cy,GS.radius,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#FFD066';
      GS.loot.forEach(function(l){ ctx.beginPath(); ctx.arc(l.x,l.y,7,0,Math.PI*2); ctx.fill(); });
      ctx.fillStyle='#A9BB8C';
      ctx.beginPath(); ctx.arc(GS.p.x,GS.p.y,13,0,Math.PI*2); ctx.fill();
    },
    drawIdle: function(ctx){ ctx.fillStyle='rgba(255,255,255,0.04)'; ctx.fillRect(0,0,W,H); },
    result: function(){
      var t = fmt1(GS.time);
      return {
        title: GS.hp<=0 ? '결과: '+t+'초 만에 탈락' : '결과: '+t+'초 생존',
        text: GS.time>=20 ? '치킨 각! 자기장을 잘 예측하며 움직였어요.' : '장이 줄어드는 속도보다 먼저 중앙으로 이동하는 게 핵심이에요.',
        scoreForCompare: GS.time, bestDisplay: t+'초'
      };
    }
  };

  /* ---- 클래시로얄: 타워 디펜스 ---- */
  MiniGames.defense = {
    introText:'카드를 눌러 유닛을 소환해서 몰려오는 적을 막고 타워를 지켜보세요.',
    controlsText:'조작법 · 하단 카드 버튼을 탭/클릭해서 유닛 소환',
    cards: [
      {name:'전사', cost:0.9, hp:24, dmg:9, speed:70, color:'#E4BE63'},
      {name:'궁수', cost:1.4, hp:14, dmg:14, speed:55, color:'#8FD0E8'},
      {name:'탱커', cost:2.2, hp:55, dmg:6, speed:40, color:'#C97A4C'}
    ],
    hudTemplate: function(){
      return '<span>타워 HP <b id="hudHp">100</b></span><span>처치 <b id="hudScore">0</b></span><span>생존 <b id="hudTime">0.0</b>s</span>'
        + '<div id="cardRow" style="width:100%;display:flex;gap:8px;margin-top:10px;">'
        + this.cards.map(function(c,i){
            return '<button class="btn small" data-card="'+i+'" style="flex:1;background:'+c.color+';color:#241D3D;">'+c.name+'</button>';
          }).join('')
        + '</div>';
    },
    init: function(){
      GS.towerHp = 100; GS.units=[]; GS.enemies=[]; GS.time=0; GS.kills=0;
      GS.spawnTimer=1.6; GS.over=false; GS.cooldowns=[0,0,0];
      var self=this;
      setTimeout(function(){
        var row = el('cardRow');
        if(row){
          Array.prototype.forEach.call(row.children, function(btn){
            btn.onclick = function(){
              var idx = parseInt(btn.getAttribute('data-card'),10);
              if(GS.cooldowns[idx] <= 0 && !GS.over){
                var c = self.cards[idx];
                GS.units.push({x:70,hp:c.hp,maxHp:c.hp,dmg:c.dmg,speed:c.speed,color:c.color});
                GS.cooldowns[idx] = c.cost;
              }
            };
          });
        }
      },0);
    },
    start: function(){},
    update: function(dt){
      GS.time += dt;
      for(var i=0;i<GS.cooldowns.length;i++){ if(GS.cooldowns[i]>0) GS.cooldowns[i]-=dt; }
      GS.spawnTimer -= dt;
      var rate = Math.max(0.7, 1.7 - GS.time*0.02);
      if(GS.spawnTimer<=0){
        GS.spawnTimer = rate;
        GS.enemies.push({x:W-40, hp:18+GS.time*0.6, maxHp:18+GS.time*0.6, dmg:8, speed:48});
      }
      // 유닛 전진
      GS.units.forEach(function(u){ u.targetX = null; });
      GS.enemies.forEach(function(en){ en.targetX = null; });

      var y = H/2;
      GS.units.forEach(function(u){
        var foe = null, minD = 46;
        GS.enemies.forEach(function(en){ if(Math.abs(en.x-u.x)<minD){ foe=en; minD=Math.abs(en.x-u.x); } });
        if(foe){ foe.hp -= u.dmg*dt; u.hp -= foe.dmg*dt*0.6; }
        else { u.x += u.speed*dt; }
      });
      GS.enemies.forEach(function(en){
        var foe=null, minD=46;
        GS.units.forEach(function(u){ if(Math.abs(en.x-u.x)<minD){ foe=u; minD=Math.abs(en.x-u.x); } });
        if(!foe){ en.x -= en.speed*dt; }
        if(en.x <= 60){ GS.towerHp -= 14*dt; }
      });
      for(var i2=GS.units.length-1;i2>=0;i2--){ if(GS.units[i2].hp<=0) GS.units.splice(i2,1); }
      for(var j2=GS.enemies.length-1;j2>=0;j2--){
        if(GS.enemies[j2].hp<=0){ GS.enemies.splice(j2,1); GS.kills++; }
      }
      if(GS.towerHp<=0){ GS.towerHp=0; GS.over=true; }

      el('hudHp') && (el('hudHp').textContent = Math.ceil(GS.towerHp));
      el('hudScore') && (el('hudScore').textContent = GS.kills);
      el('hudTime') && (el('hudTime').textContent = fmt1(GS.time));
      var row = el('cardRow');
      if(row){
        Array.prototype.forEach.call(row.children,function(btn,idx){
          btn.disabled = GS.cooldowns[idx] > 0;
          btn.style.opacity = GS.cooldowns[idx]>0 ? 0.5 : 1;
        });
      }
    },
    draw: function(ctx){
      ctx.fillStyle='rgba(255,255,255,0.03)'; ctx.fillRect(0,0,W,H);
      var y=H/2;
      ctx.strokeStyle='rgba(255,255,255,0.15)'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
      ctx.fillStyle='#E4BE63';
      roundRect(ctx, 30, y-30, 30, 60, 6); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,0.85)'; ctx.font='11px Sora'; ctx.textAlign='center';
      ctx.fillText('타워', 45, y-38);

      GS.units.forEach(function(u){
        ctx.fillStyle=u.color;
        ctx.beginPath(); ctx.arc(u.x,y,14,0,Math.PI*2); ctx.fill();
      });
      GS.enemies.forEach(function(en){
        ctx.fillStyle='#FF6A6A';
        ctx.beginPath(); ctx.arc(en.x,y,14,0,Math.PI*2); ctx.fill();
      });
    },
    drawIdle: function(ctx){ ctx.fillStyle='rgba(255,255,255,0.04)'; ctx.fillRect(0,0,W,H); },
    result: function(){
      return {
        title: GS.towerHp<=0 ? '결과: 타워 함락 (처치 '+GS.kills+')' : '결과: '+GS.kills+'마리 처치하고 생존',
        text: GS.kills>=10 ? '완벽한 수비! 카드 타이밍이 훌륭했어요.' : '쿨타임이 짧은 유닛부터 자주 소환하면 수비가 더 쉬워져요.',
        scoreForCompare: GS.kills, bestDisplay: GS.kills+'마리'
      };
    }
  };

  /* ---- FC 모바일: 페널티킥 ---- */
  MiniGames.penalty = {
    introText:'골대의 구역을 클릭해서 슛을 쏘세요. 골키퍼가 같은 구역으로 막으면 실패! 총 5번의 기회가 있어요.',
    controlsText:'조작법 · 골대 구역을 탭/클릭해서 슛',
    hudTemplate: function(){ return '<span>골 <b id="hudScore">0</b></span><span>남은 기회 <b id="hudShots">5</b></span>'; },
    zones: [[0,0],[1,0],[2,0],[0,1],[1,1],[2,1]],
    init: function(){
      GS.goals=0; GS.shots=5; GS.over=false; GS.phase='aim'; GS.result=null; GS.resultTimer=0;
      GS.keeperZone=-1; GS.shotZone=-1;
    },
    start: function(){},
    zoneRect: function(i){
      var gw = W*0.7, gh = H*0.5, gx=(W-gw)/2, gy=40;
      var cw = gw/3, ch = gh/2;
      var col = i%3, row = Math.floor(i/3);
      return { x:gx+col*cw, y:gy+row*ch, w:cw, h:ch };
    },
    update: function(dt){
      var self=this;
      if(GS.phase==='aim'){
        if(input.justClick){
          for(var i=0;i<6;i++){
            var r = this.zoneRect(i);
            if(input.clickX>=r.x && input.clickX<=r.x+r.w && input.clickY>=r.y && input.clickY<=r.y+r.h){
              GS.shotZone = i;
              GS.keeperZone = Math.floor(Math.random()*6);
              GS.phase='result';
              GS.resultTimer=0.9;
              var sp = toScreen(W/2, H*0.3);
              if(GS.shotZone !== GS.keeperZone){ GS.goals++; spawnConfetti(sp.x, sp.y, '#5CE98C', 16); }
              else { screenFlash('rgba(255,60,60,0.22)'); shakeBody(); }
              GS.shots--;
            }
          }
        }
      } else if(GS.phase==='result'){
        GS.resultTimer -= dt;
        if(GS.resultTimer<=0){
          if(GS.shots<=0){ GS.over=true; }
          else { GS.phase='aim'; GS.shotZone=-1; GS.keeperZone=-1; }
        }
      }
      el('hudScore') && (el('hudScore').textContent=GS.goals);
      el('hudShots') && (el('hudShots').textContent=Math.max(0,GS.shots));
    },
    draw: function(ctx){
      ctx.fillStyle='rgba(255,255,255,0.03)'; ctx.fillRect(0,0,W,H);
      var self=this;
      ctx.strokeStyle='rgba(255,255,255,0.5)'; ctx.lineWidth=4;
      var gr = { x:(W-W*0.7)/2, y:40, w:W*0.7, h:H*0.5 };
      ctx.strokeRect(gr.x,gr.y,gr.w,gr.h);
      for(var i=0;i<6;i++){
        var r = this.zoneRect(i);
        ctx.fillStyle = 'rgba(76,217,122,0.08)';
        ctx.fillRect(r.x+3,r.y+3,r.w-6,r.h-6);
        if(GS.phase==='result' && i===GS.keeperZone){
          ctx.fillStyle='rgba(255,106,106,0.5)';
          ctx.fillRect(r.x+3,r.y+3,r.w-6,r.h-6);
        }
        if(GS.phase==='result' && i===GS.shotZone){
          ctx.strokeStyle = (GS.shotZone===GS.keeperZone) ? '#FF6A6A' : '#5CE98C';
          ctx.lineWidth=4;
          ctx.strokeRect(r.x+6,r.y+6,r.w-12,r.h-12);
        }
      }
      // 공
      var ballX = gr.x+gr.w/2, ballY = H-30;
      if(GS.phase==='result'){
        var target = this.zoneRect(GS.shotZone);
        ballX = target.x+target.w/2; ballY = target.y+target.h/2;
      }
      ctx.fillStyle='#fff';
      ctx.beginPath(); ctx.arc(ballX,ballY,10,0,Math.PI*2); ctx.fill();

      if(GS.phase==='result'){
        ctx.fillStyle = GS.shotZone===GS.keeperZone ? '#FF6A6A' : '#5CE98C';
        ctx.font='bold 20px Fredoka'; ctx.textAlign='center';
        ctx.fillText(GS.shotZone===GS.keeperZone ? '선방!' : '골인!', W/2, H-46);
      }
    },
    drawIdle: function(ctx){ ctx.fillStyle='rgba(255,255,255,0.04)'; ctx.fillRect(0,0,W,H); },
    result: function(){
      return {
        title:'결과: 5번 중 '+GS.goals+'골 성공',
        text: GS.goals>=4 ? '완벽한 키커! FC 모바일에서도 통할 실력이에요.' : '구석 구역을 노리면 골키퍼가 막기 더 어려워져요.',
        scoreForCompare: GS.goals, bestDisplay: GS.goals+'/5골'
      };
    }
  };

  /* ---- 모두의마블: 주사위 보드런 ---- */
  MiniGames.board = {
    tiles: [0,20,-10,0,30,-15,50,0,-20,25,0,-10],
    introText:'주사위를 굴려 보드를 돌며 코인을 모으세요. 8번의 턴 안에 최대한 코인을 불려보세요.',
    controlsText:'조작법 · 아래 "주사위 굴리기" 버튼을 탭/클릭',
    hudTemplate: function(){
      return '<span>코인 <b id="hudScore">100</b></span><span>남은 턴 <b id="hudTurns">8</b></span>'
        + '<div style="width:100%;text-align:center;margin-top:10px;"><button class="btn small" id="rollBtn">주사위 굴리기</button></div>';
    },
    init: function(){
      GS.pos=0; GS.coins=100; GS.turns=8; GS.over=false; GS.rolling=false; GS.stepsLeft=0; GS._stepTimer=0;
      var self=this;
      setTimeout(function(){
        var btn = el('rollBtn');
        if(btn){ btn.onclick = function(){ self.roll(); }; }
      },0);
    },
    start: function(){},
    roll: function(){
      if(GS.rolling || GS.over || GS.turns<=0) return;
      GS.rolling = true;
      GS.stepsLeft = 1+Math.floor(Math.random()*6);
      var btn=el('rollBtn'); if(btn) btn.disabled=true;
    },
    update: function(dt){
      if(GS.rolling){
        GS._stepTimer -= dt;
        if(GS._stepTimer<=0){
          GS._stepTimer = 0.14;
          if(GS.stepsLeft>0){
            GS.pos = (GS.pos+1) % this.tiles.length;
            GS.stepsLeft--;
          } else {
            var effect = this.tiles[GS.pos];
            GS.coins = Math.max(0, GS.coins+effect);
            var sp = toScreen(W/2,H/2);
            if(effect>0){ spawnConfetti(sp.x,sp.y,'#FFD066',10); }
            else if(effect<0){ screenFlash('rgba(255,60,60,0.2)'); }
            GS.turns--;
            GS.rolling=false;
            var btn=el('rollBtn');
            if(GS.turns<=0){ GS.over=true; if(GS.coins>=150){ showBanner('대박!'); } }
            else if(btn){ btn.disabled=false; }
          }
        }
      }
      el('hudScore') && (el('hudScore').textContent=GS.coins);
      el('hudTurns') && (el('hudTurns').textContent=Math.max(0,GS.turns));
    },
    draw: function(ctx){
      ctx.fillStyle='rgba(255,255,255,0.03)'; ctx.fillRect(0,0,W,H);
      var n=this.tiles.length, cx=W/2, cy=H/2, r=Math.min(W,H)/2-40;
      for(var i=0;i<n;i++){
        var ang=(i/n)*Math.PI*2-Math.PI/2;
        var x=cx+Math.cos(ang)*r, y=cy+Math.sin(ang)*r;
        ctx.beginPath();
        ctx.fillStyle = i===GS.pos ? '#FFD066' : (this.tiles[i]>=0 ? '#3A2A12' : '#4A1E1E');
        ctx.arc(x,y,20,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='#fff'; ctx.font='11px Sora'; ctx.textAlign='center';
        ctx.fillText(this.tiles[i]===0?'★':(this.tiles[i]>0?'+'+this.tiles[i]:this.tiles[i]+''), x, y+4);
      }
    },
    drawIdle: function(ctx){ ctx.fillStyle='rgba(255,255,255,0.04)'; ctx.fillRect(0,0,W,H); },
    result: function(){
      return {
        title:'결과: 코인 '+GS.coins+'개',
        text: GS.coins>=150 ? '대박 행운이에요! 코인이 두둑하게 쌓였어요.' : '함정 칸만 피해도 코인이 훨씬 잘 쌓여요.',
        scoreForCompare:GS.coins, bestDisplay:GS.coins+'개'
      };
    }
  };

})();
</script>
</body>
</html>
